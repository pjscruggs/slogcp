---
name: Manual E2E Test Trigger
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Target to run E2E tests on
        required: false
        default: pr
        type: choice
        options:
          - pr
          - main_latest
      pr_number:
        description: PR number to run E2E tests on (required for mode=pr)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read
  id-token: write

jobs:
  trigger_e2e:
    name: Manually Trigger E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: e2e-gate-${{ inputs.mode == 'pr' && inputs.pr_number || 'main-latest' }}
      cancel-in-progress: false
    env:
      CHECK_RUN_NAME: E2E Tests (GCP)
      DISPATCH_MODE: ${{ inputs.mode }}
      DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
      LOCAL_VALIDATION_CHECK_NAME: Local Validation Ready for E2E
      GCS_BUCKET_NAME: ${{ secrets.GCP_E2E_ARTIFACTS_BUCKET }}
      GCS_SOURCE_STAGING_DIR: gs://${{ secrets.GCP_E2E_ARTIFACTS_BUCKET }}/cloudbuild/source
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GITHUB_TOKEN_SECRET_VERSION: projects/${{ secrets.GCP_PROJECT_ID }}/secrets/${{ secrets.GCP_GITHUB_TOKEN_SECRET_NAME }}/versions/latest
      ARTIFACT_REGISTRY_REPO: ${{ secrets.GCP_E2E_ARTIFACT_REGISTRY_REPO }}
      E2E_SERVICE_ACCOUNT: ${{ secrets.GCP_E2E_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      E2E_CALLER_SERVICE_ACCOUNT: ${{ secrets.GCP_E2E_CLOUD_BUILD_SERVICE_ACCOUNT_EMAIL }}
      TRACE_PUBSUB_TOPIC: ${{ secrets.GCP_E2E_TRACE_PUBSUB_TOPIC }}
      TRACE_PUBSUB_SUBSCRIPTION: ${{ secrets.GCP_E2E_TRACE_PUBSUB_SUBSCRIPTION }}
      RUN_REGION: ${{ secrets.GCP_E2E_RUN_REGION }}

    steps:
      - name: Verify Authorization
        # actions/github-script v8 (pinned)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const actor = context.actor;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let permission = 'none';
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: actor
              });
              permission = data.permission;
            } catch (error) {
              core.warning(`Unable to resolve collaborator permission for ${actor}: ${error.message}`);
              core.setFailed(`❌ Unauthorized: ${actor} does not have maintainer access.`);
              return;
            }

            const allowed = new Set(['admin', 'maintain', 'write']);
            if (!allowed.has(permission)) {
              core.setFailed(`❌ Unauthorized: ${actor} has '${permission}' permission and cannot trigger E2E tests.`);
              return;
            }

            core.info(`✅ Authorized maintainer: ${actor} (${permission})`);

      - name: Validate Inputs
        shell: bash
        run: |
          case "$DISPATCH_MODE" in
            pr)
              if [[ ! "$DISPATCH_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
                echo "pr_number must be a positive integer when mode=pr" >&2
                exit 1
              fi
              ;;
            main_latest)
              if [[ -n "$DISPATCH_PR_NUMBER" ]]; then
                echo "pr_number must be empty when mode=main_latest" >&2
                exit 1
              fi
              ;;
            *)
              echo "mode must be pr or main_latest" >&2
              exit 1
              ;;
          esac

      - name: Get PR Information
        if: ${{ inputs.mode == 'pr' }}
        id: pr_info
        # actions/github-script v8 (pinned)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const rawPullNumber = process.env.PR_NUMBER || '';
            if (!/^[1-9][0-9]*$/.test(rawPullNumber)) {
              core.setFailed('pr_number must be a positive integer.');
              return;
            }
            const pullNumber = Number(rawPullNumber);
            if (!Number.isSafeInteger(pullNumber)) {
              core.setFailed('pr_number exceeds the supported integer range.');
              return;
            }
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber
            });
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('author', pr.data.user.login);
            return pr.data;
        env:
          PR_NUMBER: ${{ inputs.pr_number }}

      - name: Resolve latest main SHA
        if: ${{ inputs.mode == 'main_latest' }}
        id: main_sha
        # actions/github-script v8 (pinned)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main'
            });
            core.setOutput('sha', ref.object.sha);

      - name: Select Target SHA
        id: target
        shell: bash
        run: |
          if [ "$DISPATCH_MODE" = "main_latest" ]; then
            head_sha="$MAIN_HEAD_SHA"
            pr_number=''
          else
            head_sha="$PR_HEAD_SHA"
            pr_number="$DISPATCH_PR_NUMBER"
          fi

          printf 'head_sha=%s\n' "$head_sha" >>"$GITHUB_OUTPUT"
          printf 'pr_number=%s\n' "$pr_number" >>"$GITHUB_OUTPUT"
        env:
          MAIN_HEAD_SHA: ${{ steps.main_sha.outputs.sha }}
          PR_HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}

      - name: Require successful local validation before manual PR E2E
        if: ${{ steps.target.outputs.pr_number != '' }}
        id: local_validation_gate
        # actions/github-script v8 (pinned)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expectedSha = process.env.EXPECTED_SHA;
            const rawPullNumber = process.env.PR_NUMBER || '';
            if (!/^[1-9][0-9]*$/.test(rawPullNumber)) {
              core.setFailed('Sanitized pr_number output is invalid.');
              return;
            }
            const pullNumber = Number(rawPullNumber);
            if (!Number.isSafeInteger(pullNumber)) {
              core.setFailed('Sanitized pr_number output exceeds the supported integer range.');
              return;
            }
            const workflowFile = 'validation_pipeline.yml';
            const workflowPath = '.github/workflows/validation_pipeline.yml';
            const targetJobName = process.env.LOCAL_VALIDATION_CHECK_NAME;
            const normalizePath = value => String(value || '').split('@', 1)[0];

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowFile,
              head_sha: expectedSha,
              per_page: 100
            });
            const eligibleRuns = data.workflow_runs
              .filter(run =>
                run.head_sha === expectedSha &&
                run.event === 'pull_request' &&
                normalizePath(run.path) === workflowPath &&
                (run.pull_requests || []).some(pr => Number(pr.number) === pullNumber)
              )
              .sort((a, b) => Number(b.id) - Number(a.id));
            const run = eligibleRuns[0];

            if (!run) {
              core.setFailed(`No pull_request ${workflowFile} run exists for PR #${pullNumber} at ${expectedSha}.`);
              return;
            }
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed(
                `Validation run ${run.id} attempt ${run.run_attempt} is ${run.status}/${run.conclusion || 'none'} for ${expectedSha}.`
              );
              return;
            }

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner,
                repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100
              }
            );
            const matchingJobs = jobs.filter(job =>
              job.name === targetJobName &&
              Number(job.run_id) === Number(run.id) &&
              Number(job.run_attempt) === Number(run.run_attempt) &&
              job.head_sha === expectedSha
            );
            const job = matchingJobs[0];
            if (
              matchingJobs.length !== 1 ||
              job.status !== 'completed' ||
              job.conclusion !== 'success'
            ) {
              const status = job?.status ?? 'not_found';
              const conclusion = job?.conclusion ?? 'unknown';
              core.setFailed(
                `Expected exactly one successful ${targetJobName} job in validation run ${run.id} attempt ${run.run_attempt}; found ${matchingJobs.length} (${status}/${conclusion}).`
              );
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber
            });
            if (pr.state !== 'open') {
              core.setFailed(`PR #${pullNumber} is ${pr.state}; expected an open PR.`);
              return;
            }
            const expectedBaseRepo = `${owner}/${repo}`.toLowerCase();
            if (
              pr.base.ref !== 'main' ||
              String(pr.base.repo?.full_name || '').toLowerCase() !== expectedBaseRepo
            ) {
              core.setFailed(
                `PR #${pullNumber} targets ${pr.base.repo?.full_name || 'unknown'}/${pr.base.ref}; expected ${owner}/${repo}/main.`
              );
              return;
            }
            if (pr.head.sha !== expectedSha) {
              core.setFailed(`PR #${pullNumber} head changed from ${expectedSha} to ${pr.head.sha}.`);
              return;
            }
            const { data: baseRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${pr.base.ref}`
            });
            const currentBaseSha = baseRef.object.sha;
            const { data: comparison } = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: currentBaseSha,
              head: expectedSha,
              per_page: 1
            });
            const containsCurrentBase =
              ['ahead', 'identical'].includes(comparison.status) &&
              Number(comparison.behind_by) === 0 &&
              comparison.merge_base_commit?.sha === currentBaseSha;
            if (!containsCurrentBase) {
              core.setFailed(
                `PR #${pullNumber} head ${expectedSha} does not contain current ${pr.base.ref} ${currentBaseSha}.`
              );
              return;
            }

            core.info(
              `Authorized validation run ${run.id} attempt ${run.run_attempt}, job ${job.id}, head ${expectedSha}, base ${currentBaseSha}.`
            );
            core.setOutput('ok', 'true');
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.head_sha }}
          LOCAL_VALIDATION_CHECK_NAME: ${{ env.LOCAL_VALIDATION_CHECK_NAME }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}

      - name: Generate E2E Run ID
        id: run_id
        shell: bash
        run: |
          run_id="$(date -u +%Y%m%dT%H%M%S)-$RANDOM"
          printf 'e2e_run_id=%s\n' "$run_id" >>"$GITHUB_OUTPUT"

      - name: Generate App Token for E2E
        id: app_token
        # actions/create-github-app-token v2 (pinned)
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.E2E_APP_ID }}
          private-key: ${{ secrets.E2E_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout Workflow Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Target Source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ steps.target.outputs.head_sha }}
          path: e2e-target-source

      - name: Create or Update Stable E2E Check
        id: create_check
        # actions/github-script v8 (pinned)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const checkName = process.env.CHECK_RUN_NAME;
            const sha = process.env.EXPECTED_SHA;
            const runId = process.env.E2E_RUN_ID;
            const existing = process.env.PR_NUMBER
              ? (await github.rest.checks.listForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: sha,
                  filter: 'latest',
                  per_page: 100
                })).data.check_runs
                  .filter(run => run.name === checkName)
                  .sort((a, b) => {
                    const aTime = Date.parse(a.started_at || a.completed_at || 0);
                    const bTime = Date.parse(b.started_at || b.completed_at || 0);
                    return bTime - aTime;
                  })[0]
              : null;

            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: checkName,
              status: 'in_progress',
              external_id: runId,
              started_at: new Date().toISOString(),
              output: {
                title: checkName,
                summary: `Manual Google Cloud Build E2E run ${runId} triggered by @${context.actor}.`
              }
            };

            if (existing) {
              await github.rest.checks.update({
                ...params,
                check_run_id: existing.id
              });
              core.setOutput('check_run_id', existing.id);
              return;
            }

            const { data: checkRun } = await github.rest.checks.create({
              ...params,
              head_sha: sha
            });
            core.setOutput('check_run_id', checkRun.id);
        env:
          CHECK_RUN_NAME: ${{ env.CHECK_RUN_NAME }}
          E2E_RUN_ID: ${{ steps.run_id.outputs.e2e_run_id }}
          EXPECTED_SHA: ${{ steps.target.outputs.head_sha }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}

      - name: Authenticate to Google Cloud
        if: ${{ steps.target.outputs.pr_number == '' || steps.local_validation_gate.outputs.ok == 'true' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_MANUAL_E2E_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_MANUAL_E2E_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        if: ${{ steps.target.outputs.pr_number == '' || steps.local_validation_gate.outputs.ok == 'true' }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Run E2E Cloud Build
        if: ${{ steps.target.outputs.pr_number == '' || steps.local_validation_gate.outputs.ok == 'true' }}
        id: cloud_build
        shell: bash
        run: |
          cd e2e-target-source
          bash ../.github/scripts/run_e2e_cloud_build.sh \
            --source-mode local \
            --trusted-e2e-root ../.e2e \
            --dependency-mode floor \
            --toolchain-mode repo
        env:
          LIB_REPO_FULL_NAME: ${{ github.repository }}
          PR_SHA: ${{ steps.target.outputs.head_sha }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          CHECK_RUN_ID: ${{ steps.create_check.outputs.check_run_id }}
          LIB_RUN_ID: ${{ github.run_id }}
          E2E_RUN_ID: ${{ steps.run_id.outputs.e2e_run_id }}
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          GITHUB_TOKEN_SECRET_VERSION: ${{ env.GITHUB_TOKEN_SECRET_VERSION }}
          ARTIFACT_REGISTRY_REPO: ${{ env.ARTIFACT_REGISTRY_REPO }}
          E2E_SERVICE_ACCOUNT: ${{ env.E2E_SERVICE_ACCOUNT }}
          E2E_CALLER_SERVICE_ACCOUNT: ${{ env.E2E_CALLER_SERVICE_ACCOUNT }}
          TRACE_PUBSUB_TOPIC: ${{ env.TRACE_PUBSUB_TOPIC }}
          TRACE_PUBSUB_SUBSCRIPTION: ${{ env.TRACE_PUBSUB_SUBSCRIPTION }}
          RUN_REGION: ${{ env.RUN_REGION }}
          GCS_BUCKET_NAME: ${{ env.GCS_BUCKET_NAME }}
          GCS_SOURCE_STAGING_DIR: ${{ env.GCS_SOURCE_STAGING_DIR }}

      - name: Revalidate PR authority after E2E
        if: ${{ always() && steps.target.outputs.pr_number != '' && steps.local_validation_gate.outputs.ok == 'true' && steps.cloud_build.outputs.build_status == 'SUCCESS' }}
        id: post_build_validation
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expectedSha = process.env.EXPECTED_SHA;
            const pullNumber = Number(process.env.PR_NUMBER);
            const workflowFile = 'validation_pipeline.yml';
            const workflowPath = '.github/workflows/validation_pipeline.yml';
            const targetJobName = process.env.LOCAL_VALIDATION_CHECK_NAME;
            const normalizePath = value => String(value || '').split('@', 1)[0];
            const reject = summary => {
              core.setOutput('ok', 'false');
              core.setOutput('summary', summary);
            };

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowFile,
              head_sha: expectedSha,
              per_page: 100
            });
            const eligibleRuns = data.workflow_runs
              .filter(run =>
                run.head_sha === expectedSha &&
                run.event === 'pull_request' &&
                normalizePath(run.path) === workflowPath &&
                (run.pull_requests || []).some(pr => Number(pr.number) === pullNumber)
              )
              .sort((a, b) => Number(b.id) - Number(a.id));
            const run = eligibleRuns[0];

            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              reject(
                `Newest direct validation run is ${run?.status || 'not_found'}/${run?.conclusion || 'none'} for PR #${pullNumber} at ${expectedSha}.`
              );
              return;
            }

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner,
                repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100
              }
            );
            const matchingJobs = jobs.filter(job =>
              job.name === targetJobName &&
              Number(job.run_id) === Number(run.id) &&
              Number(job.run_attempt) === Number(run.run_attempt) &&
              job.head_sha === expectedSha
            );
            const job = matchingJobs[0];
            if (
              matchingJobs.length !== 1 ||
              job.status !== 'completed' ||
              job.conclusion !== 'success'
            ) {
              reject(
                `Expected one successful ${targetJobName} job in validation run ${run.id} attempt ${run.run_attempt}; found ${matchingJobs.length}.`
              );
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber
            });
            const expectedBaseRepo = `${owner}/${repo}`.toLowerCase();
            if (
              pr.base.ref !== 'main' ||
              String(pr.base.repo?.full_name || '').toLowerCase() !== expectedBaseRepo
            ) {
              reject(
                `PR #${pullNumber} targets ${pr.base.repo?.full_name || 'unknown'}/${pr.base.ref}; expected ${owner}/${repo}/main.`
              );
              return;
            }
            if (pr.state !== 'open' || pr.head.sha !== expectedSha) {
              reject(
                `PR #${pullNumber} is ${pr.state} with head ${pr.head.sha}; expected an open PR at ${expectedSha}.`
              );
              return;
            }

            const { data: baseRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${pr.base.ref}`
            });
            const currentBaseSha = baseRef.object.sha;
            const { data: comparison } = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: currentBaseSha,
              head: expectedSha,
              per_page: 1
            });
            const containsCurrentBase =
              ['ahead', 'identical'].includes(comparison.status) &&
              Number(comparison.behind_by) === 0 &&
              comparison.merge_base_commit?.sha === currentBaseSha;
            if (!containsCurrentBase) {
              reject(
                `PR #${pullNumber} head ${expectedSha} does not contain current ${pr.base.ref} ${currentBaseSha}.`
              );
              return;
            }

            core.setOutput('ok', 'true');
            core.setOutput(
              'summary',
              `Revalidated run ${run.id} attempt ${run.run_attempt}, job ${job.id}, head ${expectedSha}, base ${currentBaseSha}.`
            );
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.head_sha }}
          LOCAL_VALIDATION_CHECK_NAME: ${{ env.LOCAL_VALIDATION_CHECK_NAME }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}

      - name: Generate App Token for E2E Finalization
        if: ${{ always() && (steps.target.outputs.pr_number == '' || steps.local_validation_gate.outputs.ok == 'true') }}
        id: final_app_token
        # actions/create-github-app-token v2 (pinned)
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.E2E_APP_ID }}
          private-key: ${{ secrets.E2E_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Finalize E2E Check
        if: ${{ always() && (steps.target.outputs.pr_number == '' || steps.local_validation_gate.outputs.ok == 'true') }}
        id: finalize_check
        # actions/github-script v8 (pinned)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ steps.final_app_token.outputs.token }}
          script: |
            const buildStatus = process.env.BUILD_STATUS.toUpperCase();
            const checkRunId = Number(process.env.CHECK_RUN_ID);
            const e2eRunId = process.env.E2E_RUN_ID;
            if (!Number.isSafeInteger(checkRunId) || checkRunId <= 0 || !e2eRunId) {
              core.setFailed('E2E finalization identifiers are invalid.');
              return;
            }
            const isPullRequest = process.env.PR_NUMBER !== '';
            const postBuildAuthorized =
              !isPullRequest || process.env.POST_BUILD_VALIDATION_OK === 'true';
            const detailsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let conclusion = 'failure';
            if (buildStatus === 'SUCCESS' && postBuildAuthorized) {
              conclusion = 'success';
            } else if (buildStatus === 'SUCCESS') {
              conclusion = 'action_required';
            } else if (buildStatus === 'CANCELLED' || buildStatus === 'TIMEOUT') {
              conclusion = 'cancelled';
            }

            const summaryLines = [
              `Google Cloud Build E2E tests finished: **${buildStatus || 'UNKNOWN'}**.`,
              buildStatus === 'SUCCESS' && isPullRequest && !postBuildAuthorized
                ? process.env.POST_BUILD_VALIDATION_SUMMARY || 'Post-build PR validation did not authorize this result.'
                : '',
              'Maintainers can inspect internal Cloud Build logs and artifacts from Google Cloud.'
            ].filter(Boolean);

            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: checkRunId,
              details_url: detailsUrl,
              external_id: e2eRunId,
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: process.env.CHECK_RUN_NAME,
                summary: summaryLines.join('\n')
              }
            });

            core.setOutput('ok', conclusion === 'success' ? 'true' : 'false');
        env:
          BUILD_STATUS: ${{ steps.cloud_build.outputs.build_status }}
          CHECK_RUN_ID: ${{ steps.create_check.outputs.check_run_id }}
          CHECK_RUN_NAME: ${{ env.CHECK_RUN_NAME }}
          E2E_RUN_ID: ${{ steps.run_id.outputs.e2e_run_id }}
          POST_BUILD_VALIDATION_OK: ${{ steps.post_build_validation.outputs.ok }}
          POST_BUILD_VALIDATION_SUMMARY: ${{ steps.post_build_validation.outputs.summary }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}

      - name: Fail workflow when E2E failed
        if: ${{ always() && (steps.target.outputs.pr_number == '' || steps.local_validation_gate.outputs.ok == 'true') && steps.finalize_check.outputs.ok != 'true' }}
        env:
          BUILD_STATUS: ${{ steps.cloud_build.outputs.build_status }}
        run: |
          echo "E2E build status: $BUILD_STATUS"
          exit 1
