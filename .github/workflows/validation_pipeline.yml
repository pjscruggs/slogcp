name: Validation Pipeline
on:
  pull_request:
    branches: [ main ]
  pull_request_target:
    branches: [ main ]
    types: [opened, reopened, synchronize]
  merge_group:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    outputs:
      validation_passed:
        description: All required local validation jobs executed successfully.
        value: ${{ jobs.local_validation_policy.outputs.validation_passed }}
    inputs:
      latest_go:
        description: Run root and example validation with the latest stable Go release.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  ci_action_validation:
    name: Validate Candidate CI Actions
    if: github.event_name != 'pull_request_target' && (inputs.latest_go || false) == false
    permissions:
      contents: read
    uses: ./.github/workflows/ci-action-smoke.yml

  # ----------------------------------
  # CLASSIFY VALIDATION SCOPE FOR PRS
  # ----------------------------------
  classify_validation_scope:
    name: Classify Validation Scope
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Classify changed files
        id: classify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            let mode = 'normal';

            if (context.eventName === 'pull_request') {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100
              });

              const paths = files.map(f => f.filename);
              const touchesGoModuleMetadata = paths.some(p => /(^|\/)go\.(mod|sum)$/.test(p));
              const onlyCiFiles = paths.length > 0 && paths.every(p => p.startsWith('.github/') || p === '.licenserc.yaml');
              const onlyAutomationConfigFiles = paths.length > 0 &&
                paths.every(p => p === 'renovate.json' || p === '.github/scripts/test_renovate_policy.py');
              const onlyExampleModuleMetadata = paths.length > 0 &&
                paths.every(p => /^\.examples\/.+\/go\.(mod|sum)$/.test(p));
              const onlyCiToolModuleMetadata = paths.length > 0 &&
                paths.every(p => /^\.github\/tools\/go\.(mod|sum)$/.test(p));
              const touchesRootGoModuleMetadata = paths.some(p => /^go\.(mod|sum)$/.test(p));
              const allowedSecurityFloorMetadata = p =>
                p === 'go.mod' ||
                p === 'go.sum' ||
                p === 'version.go' ||
                /^\.examples\/.+\/go\.(mod|sum)$/.test(p);
              const securityFloorFileScope = paths.length > 0 &&
                paths.every(allowedSecurityFloorMetadata);
              const pr = context.payload.pull_request;
              const sameRepo = pr.head.repo.full_name === context.payload.repository.full_name;
              const actor = pr.user.login;
              const trustedRenovate = actor === 'renovate[bot]' || actor === 'app/renovate';
              const labels = new Set((pr.labels || []).map(label => label.name));
              const securityPattern = /(security|vulnerab|cve|ghsa)/i;
              const securityHint =
                labels.has('security') ||
                labels.has('security:floor') ||
                securityPattern.test(pr.title || '') ||
                securityPattern.test(pr.head.ref || '');
              const isRootToolchainOnly = paths.length === 1 &&
                paths[0] === 'go.mod' &&
                files.every(file => {
                  if (file.filename !== 'go.mod' || !file.patch) {
                    return false;
                  }
                  const changedLines = file.patch
                    .split('\n')
                    .filter(line =>
                      (line.startsWith('+') || line.startsWith('-')) &&
                      !line.startsWith('+++') &&
                      !line.startsWith('---')
                    );
                  return changedLines.length > 0 &&
                    changedLines.every(line => /^[+-]toolchain\s+go\d+\.\d+\.\d+\s*$/.test(line));
                });

              if (onlyCiToolModuleMetadata) {
                mode = 'ci_tools';
              } else if (onlyCiFiles && !touchesGoModuleMetadata) {
                mode = 'ci_only';
              } else if (onlyAutomationConfigFiles) {
                mode = 'automation_config_only';
              } else if (sameRepo && trustedRenovate && onlyExampleModuleMetadata) {
                mode = 'examples_dependency';
              } else if (sameRepo && trustedRenovate && isRootToolchainOnly) {
                mode = 'toolchain_update';
              } else if (
                sameRepo &&
                trustedRenovate &&
                touchesRootGoModuleMetadata &&
                securityHint &&
                securityFloorFileScope
              ) {
                mode = 'security_floor';
              } else if (sameRepo && trustedRenovate) {
                mode = 'renovate_cloud_e2e';
              }
            }

            core.info(`Validation scope mode=${mode}`);
            core.setOutput('mode', mode);

  # ----------------------------------------
  # PLAN THE GO VERSION FOR TRACKED MODULES
  # ----------------------------------------
  go_validation_plan:
    name: Plan Go Validation
    needs: classify_validation_scope
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    env:
      LATEST_GO: ${{ inputs.latest_go || false }}
      PYTHONDONTWRITEBYTECODE: "1"
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      root_floor_version: ${{ steps.plan.outputs.root_floor_version }}
      root_version: ${{ steps.plan.outputs.root_version }}
      tools_version: ${{ steps.plan.outputs.tools_version }}
      has_examples: ${{ steps.plan.outputs.has_examples }}
      example_matrix: ${{ steps.plan.outputs.example_matrix }}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Require current PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current_base="$(
            git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
              "refs/heads/${BASE_REF}" | awk 'NR == 1 { print $1 }'
          )"
          test -n "$current_base"
          git fetch --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "$current_base"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if ! git merge-base --is-ancestor "$current_base" "$HEAD_SHA"; then
            echo "PR head $HEAD_SHA does not contain current $BASE_REF ($current_base)." >&2
            echo "Update the branch and rerun validation before merging." >&2
            exit 1
          fi
          echo "CURRENT_BASE_SHA=$current_base" >> "$GITHUB_ENV"

      - name: Validate automated compatibility and release intent
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/validate_renovate_pr.py --base "$CURRENT_BASE_SHA"

      - name: Test CI policy and release scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Validate CI shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking shell syntax: $script"
            bash -n "$script"
          done < <(find .github/scripts .e2e/scripts .e2e/cloudbuild/build-tools -type f -name '*.sh' -print0 | sort -z)

      - name: Plan Go validation
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          from collections import defaultdict
          from pathlib import Path

          version_re = re.compile(r"^(?:go)?(\d+)\.(\d+)(?:\.(\d+))?$")

          def directives(path: str) -> tuple[str, str | None]:
              go_versions = []
              toolchains = []
              for raw_line in Path(path).read_text(encoding="utf-8").splitlines():
                  fields = raw_line.split("//", 1)[0].split()
                  if len(fields) == 2 and fields[0] == "go":
                      go_versions.append(fields[1])
                  elif len(fields) == 2 and fields[0] == "toolchain":
                      toolchains.append(fields[1])
              if len(go_versions) != 1 or len(toolchains) > 1:
                  raise SystemExit(f"{path}: expected one go and at most one toolchain directive")
              return go_versions[0], toolchains[0] if toolchains else None

          def minor_spec(version: str) -> str:
              match = version_re.fullmatch(version)
              if not match:
                  raise SystemExit(f"invalid Go version: {version!r}")
              return f"{match.group(1)}.{match.group(2)}.x"

          def setup_spec(version: str) -> str:
              match = version_re.fullmatch(version)
              if not match:
                  raise SystemExit(f"invalid Go version: {version!r}")
              patch = match.group(3)
              return (
                  f"{match.group(1)}.{match.group(2)}.{patch}"
                  if patch is not None
                  else f"{match.group(1)}.{match.group(2)}.x"
              )

          tracked = subprocess.run(
              ["git", "ls-files", "-z", "--", "go.mod", ":(glob).examples/**/go.mod"],
              check=True,
              capture_output=True,
          ).stdout.split(b"\0")
          paths = sorted(part.decode("utf-8") for part in tracked if part)
          if "go.mod" not in paths:
              raise SystemExit("tracked root go.mod was not found")

          latest = os.environ["LATEST_GO"].lower() == "true"
          root_go, root_toolchain = directives("go.mod")
          root_floor_version = minor_spec(root_go)
          root_version = "stable" if latest else setup_spec(root_toolchain or root_go)
          tools_go, tools_toolchain = directives(".github/tools/go.mod")
          compiler_requirements = [root_toolchain or root_go, tools_go, tools_toolchain or tools_go]

          grouped_examples: dict[str, list[str]] = defaultdict(list)
          for path in paths:
              if path == "go.mod":
                  continue
              go_version, _ = directives(path)
              compiler_requirements.append(go_version)
              selected = "stable" if latest else setup_spec(go_version)
              grouped_examples[selected].append(path.removesuffix("/go.mod"))

          matrix = {
              "include": [
                  {"go_version": version, "modules": modules}
                  for version, modules in sorted(grouped_examples.items())
              ]
          }
          mode = "latest" if latest else "requirements"
          def version_tuple(version: str) -> tuple[int, int, int]:
              match = version_re.fullmatch(version)
              if not match:
                  raise SystemExit(f"invalid Go version: {version!r}")
              return tuple(int(part or 0) for part in match.groups())

          tools_version = "stable" if latest else setup_spec(max(compiler_requirements, key=version_tuple))
          print(f"Validation mode: {mode}")
          print(f"Root compatibility runtime: {root_floor_version}")
          print(f"Root selected runtime: {root_version}")
          print(f"CI tools compiler: {tools_version}")
          print(f"Tracked example modules: {sum(len(row['modules']) for row in matrix['include'])}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"mode={mode}\n")
              output.write(f"root_floor_version={root_floor_version}\n")
              output.write(f"root_version={root_version}\n")
              output.write(f"tools_version={tools_version}\n")
              output.write(f"has_examples={str(bool(grouped_examples)).lower()}\n")
              output.write(f"example_matrix={json.dumps(matrix, separators=(',', ':'))}\n")
          PY

  # ----------------------------------------------------
  # ROOT COMPATIBILITY (public go directive, not toolchain)
  # ----------------------------------------------------
  root_floor_validation:
    name: Validate Root Compatibility Floor (Go ${{ needs.go_validation_plan.outputs.root_floor_version }})
    needs:
      - classify_validation_scope
      - go_validation_plan
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Set up root compatibility Go runtime
        id: setup-floor-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.go_validation_plan.outputs.root_floor_version }}
          check-latest: true
          cache: false

      - name: Assert root compatibility Go runtime
        env:
          SETUP_GO_VERSION: ${{ steps.setup-floor-go.outputs.go-version }}
        run: |
          set -euo pipefail
          test "$(go env GOTOOLCHAIN)" = "local"
          test "$(go env GOVERSION)" = "go${SETUP_GO_VERSION}"
          printf 'Root compatibility runtime: GOVERSION=%s GOTOOLCHAIN=%s\n' \
            "$(go env GOVERSION)" "$(go env GOTOOLCHAIN)"

      - name: Test root module at its compatibility floor
        run: go test -mod=readonly -race -count=1 ./...

  # --------------------------------------
  # ROOT VALIDATION (runs root module code)
  # --------------------------------------
  validation:
    name: Validate Code
    needs:
      - classify_validation_scope
      - go_validation_plan
    # Skip validation on pull_request_target to avoid running the full pipeline twice per PR update.
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GO_VALIDATION_MODE: ${{ needs.go_validation_plan.outputs.mode }}
      TOOLS_MODULE: ${{ github.workspace }}/.github/tools
    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          persist-credentials: false
      

      - name: Set up CI tools compiler
        id: setup-tools-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.go_validation_plan.outputs.tools_version }}
          check-latest: true
          cache: false

      - name: Record CI tools compiler
        env:
          TOOLS_GO_VERSION: ${{ steps.setup-tools-go.outputs.go-version }}
        run: |
          set -euo pipefail
          test "$(go env GOTOOLCHAIN)" = local
          test "$(go env GOVERSION)" = "go$TOOLS_GO_VERSION"
          echo "TOOLS_GOTOOLCHAIN=go$TOOLS_GO_VERSION" >> "$GITHUB_ENV"
          echo "CI tools compiler: go$TOOLS_GO_VERSION; library compiler selected separately."

      - name: 🏗️ Set up Go
        id: setup-root-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.go_validation_plan.outputs.root_version }}
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            .github/tools/go.sum

      - name: Assert selected Go runtime
        env:
          SETUP_GO_VERSION: ${{ steps.setup-root-go.outputs.go-version }}
        run: |
          set -euo pipefail
          test "$(go env GOTOOLCHAIN)" = "local"
          test "$(go env GOVERSION)" = "go${SETUP_GO_VERSION}"
          printf 'Selected root runtime: GOVERSION=%s GOTOOLCHAIN=%s\n' \
            "$(go env GOVERSION)" "$(go env GOTOOLCHAIN)"

      - name: Verify E2E support tooling
        run: python3 -m unittest discover -s .e2e/scripts -p 'test_*.py' -v

      - name: Show pinned CI tool modules
        run: |
          set -euo pipefail
          GOTOOLCHAIN="$TOOLS_GOTOOLCHAIN" go -C "$TOOLS_MODULE" mod tidy
          git diff --exit-code -- .github/tools/go.mod .github/tools/go.sum
          GOTOOLCHAIN="$TOOLS_GOTOOLCHAIN" go -C "$TOOLS_MODULE" list -m \
            github.com/apache/skywalking-eyes \
            github.com/golangci/golangci-lint/v2 \
            golang.org/x/tools \
            golang.org/x/tools/gopls \
            golang.org/x/vuln
          "$(GOTOOLCHAIN="$TOOLS_GOTOOLCHAIN" go -C "$TOOLS_MODULE" tool -n golangci-lint)" version
          "$(GOTOOLCHAIN="$TOOLS_GOTOOLCHAIN" go -C "$TOOLS_MODULE" tool -n govulncheck)" -version

      - name: ✨ Apply root Go formatting and imports
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' root_go_files < <(
            git ls-files -z -- '*.go' \
              ':(exclude).examples/**' \
              ':(exclude).e2e/**' \
              ':(exclude)instructions_for_LLMs/**'
          )
          if (( ${#root_go_files[@]} == 0 )); then
            echo "No tracked root Go files found." >&2
            exit 1
          fi
          gofmt -w "${root_go_files[@]}"
          "$(GOTOOLCHAIN="$TOOLS_GOTOOLCHAIN" go -C "$TOOLS_MODULE" tool -n goimports)" -w "${root_go_files[@]}"

      - name: 🔧 Apply modernize fixes
        run: '"$(GOTOOLCHAIN="$TOOLS_GOTOOLCHAIN" go -C "$TOOLS_MODULE" tool -n modernize)" -fix -test ./...'

      - name: 🧹 Ensure module metadata is tidy
        run: |
          go mod tidy

      - name: 📅🕰️ Get current year in US Central Time
        id: year
        run: |
          YEAR=$(TZ='America/Chicago' date +%Y)
          echo "YEAR=$YEAR" >> $GITHUB_OUTPUT
      
      - name: 📄⚙️📅 Update license year in config
        run: |
          sed -i 's/copyright-year: .*/copyright-year: "2025-${{ steps.year.outputs.YEAR }}"/g' .licenserc.yaml
          echo "📅⬆️ Updated year to 2025-${{ steps.year.outputs.YEAR }}"

      - name: 📄🧭 Verify `.e2e` license header scope
        run: |
          grep -Fq ".e2e/scripts/**/*.sh" .licenserc.yaml
          grep -Fq ".e2e/local/scripts/**/*.sh" .licenserc.yaml
      
      - name: 📄🩹 Fix License Headers
        id: fix-license
        run: '"$(GOTOOLCHAIN="$TOOLS_GOTOOLCHAIN" go -C "$TOOLS_MODULE" tool -n license-eye)" header fix -c .licenserc.yaml'

      - name: ♻️ Restore Go toolchain (post-license-fix)
        id: restore-post-license-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.go_validation_plan.outputs.root_version }}
          check-latest: true
          cache: false

      - name: Assert selected Go runtime (post-license-fix)
        env:
          SETUP_GO_VERSION: ${{ steps.restore-post-license-go.outputs.go-version }}
        run: |
          set -euo pipefail
          test "$(go env GOTOOLCHAIN)" = "local"
          test "$(go env GOVERSION)" = "go${SETUP_GO_VERSION}"
      
      - name: 🧐 Apply Lint Fixes
        run: '"$(GOTOOLCHAIN="$TOOLS_GOTOOLCHAIN" go -C "$TOOLS_MODULE" tool -n golangci-lint)" run --fix ./...'
        continue-on-error: true
      

      - name: ✅ Ensure working tree is clean
        run: |
          if git diff --quiet; then
            exit 0
          fi

          echo "Working tree has uncommitted changes after maintenance steps."
          git status --short


          exit 1

      - name: 🧐 Verify Linting
        run: '"$(GOTOOLCHAIN="$TOOLS_GOTOOLCHAIN" go -C "$TOOLS_MODULE" tool -n golangci-lint)" run ./...'
      
      - name: 📄✅ Verify License Headers
        run: '"$(GOTOOLCHAIN="$TOOLS_GOTOOLCHAIN" go -C "$TOOLS_MODULE" tool -n license-eye)" header check -c .licenserc.yaml'

      - name: ♻️ Restore Go toolchain (pre-tests)
        id: restore-pre-tests-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.go_validation_plan.outputs.root_version }}
          check-latest: true
          cache: false

      - name: Assert selected Go runtime (pre-tests)
        env:
          SETUP_GO_VERSION: ${{ steps.restore-pre-tests-go.outputs.go-version }}
        run: |
          set -euo pipefail
          test "$(go env GOTOOLCHAIN)" = "local"
          test "$(go env GOVERSION)" = "go${SETUP_GO_VERSION}"

      - name: Run Go Tests
        if: success()
        id: go-tests
        run: |
          set -euo pipefail
          test_args=(-json -race -coverprofile=coverage.out)
          if [[ "$GO_VALIDATION_MODE" == "latest" ]]; then
            test_args+=(-count=1)
          fi
          printf 'Running root tests in %s mode with arguments:' "$GO_VALIDATION_MODE"
          printf ' %q' "${test_args[@]}"
          printf '\n'
          go test "${test_args[@]}" ./...

      - name: Print Coverage Report
        if: always()
        run: |
          echo "--- Test Coverage ---"
          if [ -f coverage.out ]; then
            cat coverage.out
          else
            echo "Coverage file (coverage.out) not found."
          fi
          echo "---------------------"
      
      - name: 🛡️🔍 Run Vulnerability Check
        run: |
          echo "Running the pinned govulncheck tool..."
          "$(GOTOOLCHAIN="$TOOLS_GOTOOLCHAIN" go -C "$TOOLS_MODULE" tool -n govulncheck)" ./...

  # --------------------------------------------------------
  # GENERATED E2E HARNESS VALIDATION
  # --------------------------------------------------------
  e2e_harness_validation:
    name: Validate Generated E2E Harness (Go ${{ needs.go_validation_plan.outputs.root_version }})
    needs:
      - classify_validation_scope
      - go_validation_plan
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Set up harness Go runtime
        id: setup-harness-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.go_validation_plan.outputs.root_version }}
          check-latest: true
          cache: false

      - name: Assert harness Go runtime
        env:
          SETUP_GO_VERSION: ${{ steps.setup-harness-go.outputs.go-version }}
        run: |
          set -euo pipefail
          test "$(go env GOTOOLCHAIN)" = "local"
          test "$(go env GOVERSION)" = "go${SETUP_GO_VERSION}"

      - name: Generate and test the E2E harness
        shell: bash
        env:
          ROOT_GO_VERSION: ${{ steps.setup-harness-go.outputs.go-version }}
        run: |
          set -euo pipefail
          e2e_temp="$(mktemp -d "${RUNNER_TEMP}/generated-e2e-harness.XXXXXX")"
          harness_dir="$e2e_temp/e2e-harness"
          mkdir -p "$harness_dir/traceproto"
          cp -a .e2e/services/e2e-harness/. "$harness_dir/"
          cp -a .e2e/services/traceproto/. "$harness_dir/traceproto/"

          python3 .e2e/scripts/generate_go_module.py \
            --module-dir "$harness_dir" \
            --go-version "$ROOT_GO_VERSION" \
            --slogcp-dir "$GITHUB_WORKSPACE" \
            --slogcp-reference v0.0.0 \
            --dependency-mode floor \
            --slogcp-shared-parity-scope package

          test -s "$harness_dir/go.mod"
          test -s "$harness_dir/go.sum"
          test -s "$harness_dir/go.work"
          test -s "$harness_dir/traceproto/go.mod"
          test -s "$harness_dir/traceproto/go.sum"
          (cd "$harness_dir" && GOWORK=off go test -race -count=1 ./...)
          (cd "$harness_dir/traceproto" && GOWORK=off go test -race -count=1 ./...)
          workspace_file="$(realpath "$harness_dir/go.work")"
          (cd "$harness_dir" && GOWORK="$workspace_file" go test -count=1 ./...)

  # ----------------------------------------------------
  # EXAMPLE VALIDATION (grouped by resolved Go version)
  # ----------------------------------------------------
  example_validation:
    name: Validate Example Modules (Go ${{ matrix.go_version }})
    needs:
      - classify_validation_scope
      - go_validation_plan
    if: github.event_name != 'pull_request_target' && needs.go_validation_plan.outputs.has_examples == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.go_validation_plan.outputs.example_matrix) }}
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: "1"
      TOOLS_MODULE: ${{ github.workspace }}/.github/tools
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Set up CI tools compiler
        id: setup-tools-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.go_validation_plan.outputs.tools_version }}
          check-latest: true
          cache: false

      - name: Record CI tools compiler
        env:
          TOOLS_GO_VERSION: ${{ steps.setup-tools-go.outputs.go-version }}
        run: |
          set -euo pipefail
          test "$(go env GOTOOLCHAIN)" = local
          test "$(go env GOVERSION)" = "go$TOOLS_GO_VERSION"
          echo "TOOLS_GOTOOLCHAIN=go$TOOLS_GO_VERSION" >> "$GITHUB_ENV"
          echo "CI tools compiler: go$TOOLS_GO_VERSION; example compiler selected separately."

      - name: Set up example Go runtime
        id: setup-example-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go_version }}
          check-latest: true
          cache: false

      - name: Assert example Go runtime
        env:
          SETUP_GO_VERSION: ${{ steps.setup-example-go.outputs.go-version }}
        run: |
          set -euo pipefail
          test "$(go env GOTOOLCHAIN)" = "local"
          test "$(go env GOVERSION)" = "go${SETUP_GO_VERSION}"

      - name: Format, tidy, test, and scan planned example modules
        shell: bash
        env:
          MODULES_JSON: ${{ toJSON(matrix.modules) }}
        run: |
          set -euo pipefail
          mapfile -t modules < <(
            python3 -c 'import json, os; print(*json.loads(os.environ["MODULES_JSON"]), sep="\n")'
          )
          if (( ${#modules[@]} == 0 )); then
            echo "The example validation matrix row contained no modules." >&2
            exit 1
          fi

          for dir in "${modules[@]}"; do
            dir="${dir%$'\r'}"
            if [[ "$dir" != .examples/* || ! -f "$dir/go.mod" ]]; then
              echo "Invalid planned example module: $dir" >&2
              exit 1
            fi
            git ls-files --error-unmatch -- "$dir/go.mod" >/dev/null

            echo "::group::Format and tidy $dir"
            (
              cd "$dir"
              mapfile -d '' -t go_files < <(git ls-files -z -- '*.go')
              if (( ${#go_files[@]} > 0 )); then
                gofmt -w "${go_files[@]}"
                "$(GOTOOLCHAIN="$TOOLS_GOTOOLCHAIN" go -C "$TOOLS_MODULE" tool -n goimports)" -w "${go_files[@]}"
              fi
              go mod tidy
            )
            echo "::endgroup::"

            echo "::group::Test $dir"
            (cd "$dir" && go test -race -count=1 ./...)
            echo "::endgroup::"

            echo "::group::Vulnerability scan $dir"
            (cd "$dir" && "$(GOTOOLCHAIN="$TOOLS_GOTOOLCHAIN" go -C "$TOOLS_MODULE" tool -n govulncheck)" ./...)
            echo "::endgroup::"

            if [[ -n "$(git status --porcelain=v1 --untracked-files=all -- "$dir")" ]]; then
              echo "Example validation produced uncommitted changes in $dir." >&2
              git status --short -- "$dir"
              git diff -- "$dir"
              exit 1
            fi
          done

  # ---------------------------------------
  # STABLE LOCAL VALIDATION CHECK FOR MERGE POLICY
  # ---------------------------------------
  local_validation_policy:
    outputs:
      validation_passed: ${{ steps.policy.outputs.validation_passed }}
    name: ${{ github.event_name == 'pull_request_target' && 'Local Validation Policy (not run for pull_request_target)' || 'Local Validation Policy' }}
    needs:
      - ci_action_validation
      - classify_validation_scope
      - go_validation_plan
      - root_floor_validation
      - validation
      - e2e_harness_validation
      - example_validation
    if: always() && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate scoped local validation result
        id: policy
        shell: bash
        env:
          SCOPE_MODE: ${{ needs.classify_validation_scope.outputs.mode }}
          GO_VALIDATION_MODE: ${{ needs.go_validation_plan.outputs.mode }}
          CI_ACTION_RESULT: ${{ needs.ci_action_validation.result }}
          CI_ACTION_PASSED: ${{ needs.ci_action_validation.outputs.validation_passed }}
          GO_PLAN_RESULT: ${{ needs.go_validation_plan.result }}
          ROOT_FLOOR_VALIDATION_RESULT: ${{ needs.root_floor_validation.result }}
          ROOT_VALIDATION_RESULT: ${{ needs.validation.result }}
          E2E_HARNESS_VALIDATION_RESULT: ${{ needs.e2e_harness_validation.result }}
          HAS_EXAMPLES: ${{ needs.go_validation_plan.outputs.has_examples }}
          EXAMPLE_VALIDATION_RESULT: ${{ needs.example_validation.result }}
        run: |
          set -euo pipefail

          if [[ "$GO_PLAN_RESULT" != "success" ]]; then
            echo "Go validation plan expected success, got: $GO_PLAN_RESULT"
            exit 1
          fi

          if [[ "$ROOT_FLOOR_VALIDATION_RESULT" != "success" ]]; then
            echo "Root compatibility-floor validation expected success, got: $ROOT_FLOOR_VALIDATION_RESULT"
            exit 1
          fi

          if [[ "$ROOT_VALIDATION_RESULT" != "success" ]]; then
            echo "Root validation expected success, got: $ROOT_VALIDATION_RESULT"
            exit 1
          fi

          if [[ "$E2E_HARNESS_VALIDATION_RESULT" != "success" ]]; then
            echo "Generated E2E harness validation expected success, got: $E2E_HARNESS_VALIDATION_RESULT"
            exit 1
          fi

          if [[ "$GO_VALIDATION_MODE" != "requirements" && "$GO_VALIDATION_MODE" != "latest" ]]; then
            echo "Go validation plan returned invalid mode: $GO_VALIDATION_MODE"
            exit 1
          fi

          if [[ "$GO_VALIDATION_MODE" == "requirements" ]]; then
            test "$CI_ACTION_RESULT" = success
            test "$CI_ACTION_PASSED" = true
          else
            test "$CI_ACTION_RESULT" = skipped
          fi

          if [[ "$HAS_EXAMPLES" == "true" ]]; then
            if [[ "$EXAMPLE_VALIDATION_RESULT" != "success" ]]; then
              echo "Example validation expected success, got: $EXAMPLE_VALIDATION_RESULT"
              exit 1
            fi
          elif [[ "$HAS_EXAMPLES" == "false" ]]; then
            if [[ "$EXAMPLE_VALIDATION_RESULT" != "skipped" ]]; then
              echo "Example validation expected skipped with no examples, got: $EXAMPLE_VALIDATION_RESULT"
              exit 1
            fi
          else
            echo "Go validation plan returned invalid has_examples value: $HAS_EXAMPLES"
            exit 1
          fi

          printf 'All required local validation jobs passed for scope=%s, mode=%s.\n' \
            "$SCOPE_MODE" "$GO_VALIDATION_MODE"
          echo "validation_passed=true" >> "$GITHUB_OUTPUT"

  local_validation_ready_for_e2e:
    name: ${{ github.event_name == 'pull_request_target' && 'Local Validation Ready for E2E (not run for pull_request_target)' || 'Local Validation Ready for E2E' }}
    needs:
      - local_validation_policy
    if: >-
      always() &&
      github.event_name != 'pull_request_target' &&
      (inputs.latest_go || false) == false
    runs-on: ubuntu-latest
    steps:
      - name: Mirror Local Validation Policy result for E2E gatekeeping
        shell: bash
        env:
          LOCAL_VALIDATION_POLICY_RESULT: ${{ needs.local_validation_policy.result }}
        run: |
          set -euo pipefail
          if [[ "$LOCAL_VALIDATION_POLICY_RESULT" == "success" ]]; then
            echo "Local Validation Policy completed successfully."
            exit 0
          fi

          echo "Local Validation Policy result: $LOCAL_VALIDATION_POLICY_RESULT"
          exit 1

  # ----------------
  # E2E GATEKEEPER
  # ----------------
  e2e_gatekeeper:
    name: E2E Test Gatekeeper
    if: github.event_name == 'pull_request_target'
    env:
      CHECK_RUN_NAME: E2E Tests (GCP)
      LOCAL_VALIDATION_CHECK_NAME: Local Validation Ready for E2E
      GCS_BUCKET_NAME: ${{ secrets.GCP_E2E_ARTIFACTS_BUCKET }}
      GCS_SOURCE_STAGING_DIR: gs://${{ secrets.GCP_E2E_ARTIFACTS_BUCKET }}/cloudbuild/source
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GITHUB_TOKEN_SECRET_VERSION: projects/${{ secrets.GCP_PROJECT_ID }}/secrets/${{ secrets.GCP_GITHUB_TOKEN_SECRET_NAME }}/versions/latest
      ARTIFACT_REGISTRY_REPO: ${{ secrets.GCP_E2E_ARTIFACT_REGISTRY_REPO }}
      E2E_SERVICE_ACCOUNT: ${{ secrets.GCP_E2E_RUNTIME_SERVICE_ACCOUNT_EMAIL }}
      E2E_CALLER_SERVICE_ACCOUNT: ${{ secrets.GCP_E2E_CLOUD_BUILD_SERVICE_ACCOUNT_EMAIL }}
      TRACE_PUBSUB_TOPIC: ${{ secrets.GCP_E2E_TRACE_PUBSUB_TOPIC }}
      TRACE_PUBSUB_SUBSCRIPTION: ${{ secrets.GCP_E2E_TRACE_PUBSUB_SUBSCRIPTION }}
      RUN_REGION: ${{ secrets.GCP_E2E_RUN_REGION }}
    concurrency:
      group: e2e-gate-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      id-token: write
    
    steps:
      - name: Classify PR Scope
        id: pr_scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });

            const paths = files.map(f => f.filename);
            const touchesGoModuleMetadata = paths.some(p => /(^|\/)go\.(mod|sum)$/.test(p));
            const onlyCiFiles = paths.length > 0 && paths.every(p => p.startsWith('.github/') || p === '.licenserc.yaml');
            const onlyAutomationConfigFiles = paths.length > 0 &&
              paths.every(p => p === 'renovate.json' || p === '.github/scripts/test_renovate_policy.py');
            const onlyExampleModuleMetadata = paths.length > 0 &&
              paths.every(p => /^\.examples\/.+\/go\.(mod|sum)$/.test(p));
            const onlyCiToolModuleMetadata = paths.length > 0 &&
              paths.every(p => /^\.github\/tools\/go\.(mod|sum)$/.test(p));
            const touchesRootGoModuleMetadata = paths.some(p => /^go\.(mod|sum)$/.test(p));
            const allowedSecurityFloorMetadata = p =>
              p === 'go.mod' ||
              p === 'go.sum' ||
              p === 'version.go' ||
              /^\.examples\/.+\/go\.(mod|sum)$/.test(p);
            const securityFloorFileScope = paths.length > 0 &&
              paths.every(allowedSecurityFloorMetadata);
            const pr = context.payload.pull_request;
            const sameRepo = pr.head.repo.full_name === context.payload.repository.full_name;
            const actor = pr.user.login;
            const trustedRenovate = actor === 'renovate[bot]' || actor === 'app/renovate';
            const labels = new Set((pr.labels || []).map(label => label.name));
            const securityPattern = /(security|vulnerab|cve|ghsa)/i;
            const securityHint =
              labels.has('security') ||
              labels.has('security:floor') ||
              securityPattern.test(pr.title || '') ||
              securityPattern.test(pr.head.ref || '');
            const isRootToolchainOnly = paths.length === 1 &&
              paths[0] === 'go.mod' &&
              files.every(file => {
                if (file.filename !== 'go.mod' || !file.patch) {
                  return false;
                }
                const changedLines = file.patch
                  .split('\n')
                  .filter(line =>
                    (line.startsWith('+') || line.startsWith('-')) &&
                    !line.startsWith('+++') &&
                    !line.startsWith('---')
                  );
                return changedLines.length > 0 &&
                  changedLines.every(line => /^[+-]toolchain\s+go\d+\.\d+\.\d+\s*$/.test(line));
              });

            let mode = 'normal';
            if (onlyCiToolModuleMetadata) {
              mode = 'ci_tools';
            } else if (onlyCiFiles && !touchesGoModuleMetadata) {
              mode = 'ci_only';
            } else if (onlyAutomationConfigFiles) {
              mode = 'automation_config_only';
            } else if (sameRepo && trustedRenovate && onlyExampleModuleMetadata) {
              mode = 'examples_dependency';
            } else if (sameRepo && trustedRenovate && isRootToolchainOnly) {
              mode = 'toolchain_update';
            } else if (
              sameRepo &&
              trustedRenovate &&
              touchesRootGoModuleMetadata &&
              securityHint &&
              securityFloorFileScope
            ) {
              mode = 'security_floor';
            } else if (sameRepo && trustedRenovate) {
              mode = 'renovate_cloud_e2e';
            }

            core.info(`Classified PR mode=${mode}; changed files=${paths.length}`);
            core.setOutput('mode', mode);

      - name: Determine Automatic Policy Path
        id: trigger_type
        run: |
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" && ("${{ steps.pr_scope.outputs.mode }}" == "ci_tools" || "${{ steps.pr_scope.outputs.mode }}" == "ci_only" || "${{ steps.pr_scope.outputs.mode }}" == "automation_config_only" || "${{ steps.pr_scope.outputs.mode }}" == "examples_dependency" || "${{ steps.pr_scope.outputs.mode }}" == "toolchain_update" || "${{ steps.pr_scope.outputs.mode }}" == "security_floor" || "${{ steps.pr_scope.outputs.mode }}" == "renovate_cloud_e2e") ]]; then
            echo "should_auto_trigger=true" >> $GITHUB_OUTPUT
          else
            echo "should_auto_trigger=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect E2E app token secrets
        id: app_token_secrets
        env:
          E2E_APP_ID: ${{ secrets.E2E_APP_ID }}
          E2E_APP_PRIVATE_KEY: ${{ secrets.E2E_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$E2E_APP_ID" && -n "$E2E_APP_PRIVATE_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require E2E app token for app-owned writes
        if: steps.app_token_secrets.outputs.available != 'true'
        run: |
          echo "E2E GitHub App credentials are required to report checks." >&2
          exit 1


      - name: Generate App Token for Initial E2E Check Writes
        if: |
          steps.app_token_secrets.outputs.available == 'true'
        id: check_start_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.E2E_APP_ID }}
          private-key: ${{ secrets.E2E_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Finalize E2E check for no-cloud manual PRs
        if: |
          steps.trigger_type.outputs.should_auto_trigger == 'false' &&
          (steps.pr_scope.outputs.mode == 'ci_tools' || steps.pr_scope.outputs.mode == 'ci_only' || steps.pr_scope.outputs.mode == 'automation_config_only')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.check_start_token.outputs.token }}
          script: |
            const checkName = process.env.CHECK_RUN_NAME;
            const mode = '${{ steps.pr_scope.outputs.mode }}';
            const headSha = context.payload.pull_request.head.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const queuedSummary = mode === 'automation_config_only'
              ? 'Skipping E2E for an automation config-only PR.'
              : 'Skipping E2E for a CI-only PR.';
            const finalSummary = mode === 'automation_config_only'
              ? 'PR touches only Renovate configuration. Cloud E2E is skipped by policy.'
              : 'PR touches only CI files and no go.mod/go.sum files. Cloud E2E is skipped by policy.';
            const { data: checkRun } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: checkName,
              head_sha: headSha,
              status: 'queued',
              output: { title: checkName, summary: queuedSummary }
            });

            await github.rest.checks.update({
              owner,
              repo,
              check_run_id: checkRun.id,
              status: 'completed',
              conclusion: 'skipped',
              completed_at: new Date().toISOString(),
              output: {
                title: checkName,
                summary: finalSummary
              }
            });
        env:
          CHECK_RUN_NAME: ${{ env.CHECK_RUN_NAME }}

      - name: Create Manual Gatekeeper Check (queued)
        if: |
          steps.trigger_type.outputs.should_auto_trigger == 'false' &&
          steps.pr_scope.outputs.mode == 'normal'
        id: manual_check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.check_start_token.outputs.token }}
          script: |
            const checkName = 'E2E Tests (GCP)';
            const sha = context.payload.pull_request.head.sha;
            const { data: checkRun } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: checkName,
              head_sha: sha,
              status: 'queued',
              output: { title: checkName, summary: 'E2E tests are queued...' }
            });
            core.setOutput('check_run_id', checkRun.id);

      - name: Update Check for Manual Trigger Required
        if: |
          steps.trigger_type.outputs.should_auto_trigger == 'false' &&
          steps.pr_scope.outputs.mode == 'normal'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.check_start_token.outputs.token }}
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: ${{ steps.manual_check.outputs.check_run_id }},
              status: 'completed',
              conclusion: 'action_required',
              completed_at: new Date().toISOString(),
              output: {
                title: 'E2E Tests (GCP) - Manual Trigger Required',
                summary: `⚠️ E2E tests require manual trigger by a maintainer after code review and after Local Validation Policy passes.

                A repository maintainer can trigger E2E tests by:
                1. Going to Actions → "Manual E2E Test Trigger" workflow
                2. Click "Run workflow" and enter PR number: ${{ github.event.pull_request.number }}

                This check must pass before the PR can be merged.`
              }
            });

      - name: Generate E2E Run ID
        if: |
          steps.trigger_type.outputs.should_auto_trigger == 'true'
        id: run_id
        shell: bash
        run: |
          echo "e2e_run_id=$(date -u +%Y%m%dT%H%M%S)-$RANDOM" >> "$GITHUB_OUTPUT"

      - name: Checkout Workflow Repository
        if: |
          steps.trigger_type.outputs.should_auto_trigger == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Target Source For Cloud E2E
        if: |
          steps.trigger_type.outputs.should_auto_trigger == 'true' &&
          (steps.pr_scope.outputs.mode == 'security_floor' || steps.pr_scope.outputs.mode == 'renovate_cloud_e2e')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: e2e-target-source

      - name: Create Stable E2E Check (in progress)
        if: |
          steps.trigger_type.outputs.should_auto_trigger == 'true'
        id: create_run_check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.check_start_token.outputs.token }}
          script: |
            const runId = '${{ steps.run_id.outputs.e2e_run_id }}';
            const mode = '${{ steps.pr_scope.outputs.mode }}';
            const name = process.env.CHECK_RUN_NAME;
            let summary = `Waiting for local validation to pass before starting Google Cloud Build E2E run ${runId}.`;
            if (mode === 'ci_only') {
              summary = 'Substantive local validation is required for a PR that touched only CI files and no go.mod/go.sum files. Cloud E2E will be skipped after local validation passes.';
            } else if (mode === 'ci_tools') {
              summary = 'CI tool module update detected. Local validation executes the updated tools; cloud E2E will be skipped after local validation passes.';
            } else if (mode === 'automation_config_only') {
              summary = 'Automation config-only change detected. Substantive local validation is required, and cloud E2E will be skipped after local validation passes.';
            } else if (mode === 'examples_dependency') {
              summary = 'Example module dependency update detected. Local validation includes example module smoke tests; cloud E2E will be skipped after that policy check passes.';
            } else if (mode === 'toolchain_update') {
              summary = 'Root go.mod toolchain-only update detected. Local validation runs with the new toolchain; cloud E2E will be skipped after local validation passes because imported slogcp consumers are unaffected.';
            } else if (mode === 'renovate_cloud_e2e') {
              summary = `Trusted Renovate PR detected. Waiting for local validation to pass before starting Google Cloud Build E2E run ${runId}.`;
            }
            const sha = context.payload.pull_request.head.sha;
            const { data: checkRun } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name,
              head_sha: sha,
              status: 'in_progress',
              external_id: runId,
              started_at: new Date().toISOString(),
              output: {
                title: name,
                summary
              }
            });
            core.setOutput('check_run_id', checkRun.id);
        env:
          CHECK_RUN_NAME: ${{ env.CHECK_RUN_NAME }}

      - name: Wait for scoped local validation to succeed
        if: |
          steps.trigger_type.outputs.should_auto_trigger == 'true'
        id: wait_validation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expectedSha = context.payload.pull_request.head.sha;
            const pullNumber = context.payload.pull_request.number;
            const workflowFile = 'validation_pipeline.yml';
            const workflowPath = '.github/workflows/validation_pipeline.yml';
            const targetJobName = process.env.LOCAL_VALIDATION_CHECK_NAME;
            const normalizePath = value => String(value || '').split('@', 1)[0];
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));
            const maxMinutes = 120;
            const sleepMs = 60_000;

            for (let minute = 0; minute < maxMinutes; minute++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowFile,
                head_sha: expectedSha,
                per_page: 100
              });
              const eligibleRuns = data.workflow_runs
                .filter(run =>
                  run.head_sha === expectedSha &&
                  run.event === 'pull_request' &&
                  normalizePath(run.path) === workflowPath &&
                  (run.pull_requests || []).some(pr => Number(pr.number) === Number(pullNumber))
                )
                .sort((a, b) => Number(b.id) - Number(a.id));
              const run = eligibleRuns[0];

              if (!run || run.status !== 'completed') {
                const status = run?.status ?? 'not_found';
                core.info(
                  `Waiting for pull_request ${workflowFile} run on ${expectedSha} (elapsed ${minute + 1}/${maxMinutes} minutes). Current status: ${status}.`
                );
                await sleep(sleepMs);
                continue;
              }

              if (run.conclusion !== 'success') {
                core.setOutput('ok', 'false');
                core.setOutput('conclusion', 'failure');
                core.setOutput(
                  'summary',
                  `Validation run ${run.id} attempt ${run.run_attempt} conclusion: ${run.conclusion || 'unknown'}.`
                );
                return;
              }

              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                {
                  owner,
                  repo,
                  run_id: run.id,
                  filter: 'latest',
                  per_page: 100
                }
              );
              const matchingJobs = jobs.filter(job =>
                job.name === targetJobName &&
                Number(job.run_id) === Number(run.id) &&
                Number(job.run_attempt) === Number(run.run_attempt) &&
                job.head_sha === expectedSha
              );

              if (matchingJobs.length > 1) {
                core.setOutput('ok', 'false');
                core.setOutput('conclusion', 'failure');
                core.setOutput(
                  'summary',
                  `Expected one ${targetJobName} job in validation run ${run.id} attempt ${run.run_attempt}; found ${matchingJobs.length}.`
                );
                return;
              }

              if (matchingJobs.length === 0 || matchingJobs[0].status !== 'completed') {
                const status = matchingJobs[0]?.status ?? 'not_found';
                core.info(
                  `Waiting for ${targetJobName} in validation run ${run.id} attempt ${run.run_attempt} (elapsed ${minute + 1}/${maxMinutes} minutes). Current status: ${status}.`
                );
                await sleep(sleepMs);
                continue;
              }

              const job = matchingJobs[0];
              if (matchingJobs.length !== 1 || job.conclusion !== 'success') {
                core.setOutput('ok', 'false');
                core.setOutput('conclusion', 'failure');
                core.setOutput(
                  'summary',
                  `Expected exactly one successful ${targetJobName} job in validation run ${run.id} attempt ${run.run_attempt}; found ${matchingJobs.length} (${job.status}/${job.conclusion || 'unknown'}).`
                );
                return;
              }

              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber
              });
              const expectedBaseRepo = `${owner}/${repo}`.toLowerCase();
              if (
                pr.base.ref !== 'main' ||
                String(pr.base.repo?.full_name || '').toLowerCase() !== expectedBaseRepo
              ) {
                core.setOutput('ok', 'false');
                core.setOutput('conclusion', 'action_required');
                core.setOutput(
                  'summary',
                  `PR #${pullNumber} targets ${pr.base.repo?.full_name || 'unknown'}/${pr.base.ref}; expected ${owner}/${repo}/main.`
                );
                return;
              }
              if (pr.head.sha !== expectedSha) {
                core.setOutput('ok', 'false');
                core.setOutput('conclusion', 'action_required');
                core.setOutput(
                  'summary',
                  `PR #${pullNumber} head changed from ${expectedSha} to ${pr.head.sha}.`
                );
                return;
              }
              const { data: baseRef } = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${pr.base.ref}`
              });
              const currentBaseSha = baseRef.object.sha;
              const { data: comparison } = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: currentBaseSha,
                head: expectedSha,
                per_page: 1
              });
              const containsCurrentBase =
                ['ahead', 'identical'].includes(comparison.status) &&
                Number(comparison.behind_by) === 0 &&
                comparison.merge_base_commit?.sha === currentBaseSha;
              if (!containsCurrentBase) {
                core.setOutput('ok', 'false');
                core.setOutput('conclusion', 'action_required');
                core.setOutput(
                  'summary',
                  `PR #${pullNumber} head ${expectedSha} does not contain current ${pr.base.ref} ${currentBaseSha}.`
                );
                return;
              }

              core.setOutput('ok', 'true');
              core.setOutput('conclusion', 'success');
              core.setOutput(
                'summary',
                `Authorized validation run ${run.id} attempt ${run.run_attempt}, job ${job.id}, head ${expectedSha}, base ${currentBaseSha}.`
              );
              return;
            }

            core.setOutput('ok', 'false');
            core.setOutput('conclusion', 'action_required');
            core.setOutput(
              'summary',
              `A successful ${targetJobName} job from a pull_request ${workflowFile} run did not complete within ${maxMinutes} minutes.`
            );
        env:
          CHECK_RUN_NAME: ${{ env.CHECK_RUN_NAME }}
          LOCAL_VALIDATION_CHECK_NAME: ${{ env.LOCAL_VALIDATION_CHECK_NAME }}

      - name: Detect GCP E2E secret availability
        if: |
          steps.trigger_type.outputs.should_auto_trigger == 'true' &&
          (steps.pr_scope.outputs.mode == 'security_floor' || steps.pr_scope.outputs.mode == 'renovate_cloud_e2e') &&
          steps.wait_validation.outputs.ok == 'true'
        id: have_secrets
        run: |
          if [ -n "${{ secrets.GCP_PROJECT_ID }}" ] &&
             [ -n "${{ secrets.GCP_VALIDATION_E2E_WIF_PROVIDER }}" ] &&
             [ -n "${{ secrets.GCP_VALIDATION_E2E_SERVICE_ACCOUNT_EMAIL }}" ] &&
             [ -n "${{ secrets.GCP_E2E_ARTIFACTS_BUCKET }}" ] &&
             [ -n "${{ secrets.GCP_GITHUB_TOKEN_SECRET_NAME }}" ] &&
             [ -n "${{ secrets.GCP_E2E_ARTIFACT_REGISTRY_REPO }}" ] &&
             [ -n "${{ secrets.GCP_E2E_RUNTIME_SERVICE_ACCOUNT_EMAIL }}" ] &&
             [ -n "${{ secrets.GCP_E2E_CLOUD_BUILD_SERVICE_ACCOUNT_EMAIL }}" ] &&
             [ -n "${{ secrets.GCP_E2E_TRACE_PUBSUB_TOPIC }}" ] &&
             [ -n "${{ secrets.GCP_E2E_TRACE_PUBSUB_SUBSCRIPTION }}" ] &&
             [ -n "${{ secrets.GCP_E2E_RUN_REGION }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: |
          steps.trigger_type.outputs.should_auto_trigger == 'true' &&
          (steps.pr_scope.outputs.mode == 'security_floor' || steps.pr_scope.outputs.mode == 'renovate_cloud_e2e') &&
          steps.wait_validation.outputs.ok == 'true' &&
          steps.have_secrets.outputs.ok == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_VALIDATION_E2E_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_VALIDATION_E2E_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        if: |
          steps.trigger_type.outputs.should_auto_trigger == 'true' &&
          (steps.pr_scope.outputs.mode == 'security_floor' || steps.pr_scope.outputs.mode == 'renovate_cloud_e2e') &&
          steps.wait_validation.outputs.ok == 'true' &&
          steps.have_secrets.outputs.ok == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Run E2E Cloud Build
        if: |
          steps.trigger_type.outputs.should_auto_trigger == 'true' &&
          (steps.pr_scope.outputs.mode == 'security_floor' || steps.pr_scope.outputs.mode == 'renovate_cloud_e2e') &&
          steps.wait_validation.outputs.ok == 'true' &&
          steps.have_secrets.outputs.ok == 'true'
        id: cloud_build
        shell: bash
        run: |
          cd e2e-target-source
          bash ../.github/scripts/run_e2e_cloud_build.sh \
            --source-mode local \
            --trusted-e2e-root ../.e2e \
            --dependency-mode floor \
            --toolchain-mode repo
        env:
          LIB_REPO_FULL_NAME: ${{ github.repository }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHECK_RUN_ID: ${{ steps.create_run_check.outputs.check_run_id }}
          LIB_RUN_ID: ${{ github.run_id }}
          E2E_RUN_ID: ${{ steps.run_id.outputs.e2e_run_id }}
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          GITHUB_TOKEN_SECRET_VERSION: ${{ env.GITHUB_TOKEN_SECRET_VERSION }}
          ARTIFACT_REGISTRY_REPO: ${{ env.ARTIFACT_REGISTRY_REPO }}
          E2E_SERVICE_ACCOUNT: ${{ env.E2E_SERVICE_ACCOUNT }}
          E2E_CALLER_SERVICE_ACCOUNT: ${{ env.E2E_CALLER_SERVICE_ACCOUNT }}
          TRACE_PUBSUB_TOPIC: ${{ env.TRACE_PUBSUB_TOPIC }}
          TRACE_PUBSUB_SUBSCRIPTION: ${{ env.TRACE_PUBSUB_SUBSCRIPTION }}
          RUN_REGION: ${{ env.RUN_REGION }}
          GCS_BUCKET_NAME: ${{ env.GCS_BUCKET_NAME }}
          GCS_SOURCE_STAGING_DIR: ${{ env.GCS_SOURCE_STAGING_DIR }}

      - name: Revalidate PR authority after Cloud E2E
        if: |
          always() &&
          steps.trigger_type.outputs.should_auto_trigger == 'true' &&
          (steps.pr_scope.outputs.mode == 'security_floor' || steps.pr_scope.outputs.mode == 'renovate_cloud_e2e') &&
          steps.wait_validation.outputs.ok == 'true' &&
          steps.have_secrets.outputs.ok == 'true' &&
          steps.cloud_build.outputs.build_status == 'SUCCESS'
        id: post_build_validation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expectedSha = process.env.EXPECTED_SHA;
            const pullNumber = Number(process.env.PR_NUMBER);
            const workflowFile = 'validation_pipeline.yml';
            const workflowPath = '.github/workflows/validation_pipeline.yml';
            const targetJobName = process.env.LOCAL_VALIDATION_CHECK_NAME;
            const normalizePath = value => String(value || '').split('@', 1)[0];
            const reject = summary => {
              core.setOutput('ok', 'false');
              core.setOutput('summary', summary);
            };

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowFile,
              head_sha: expectedSha,
              per_page: 100
            });
            const eligibleRuns = data.workflow_runs
              .filter(run =>
                run.head_sha === expectedSha &&
                run.event === 'pull_request' &&
                normalizePath(run.path) === workflowPath &&
                (run.pull_requests || []).some(pr => Number(pr.number) === pullNumber)
              )
              .sort((a, b) => Number(b.id) - Number(a.id));
            const run = eligibleRuns[0];

            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              reject(
                `Newest direct validation run is ${run?.status || 'not_found'}/${run?.conclusion || 'none'} for PR #${pullNumber} at ${expectedSha}.`
              );
              return;
            }

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner,
                repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100
              }
            );
            const matchingJobs = jobs.filter(job =>
              job.name === targetJobName &&
              Number(job.run_id) === Number(run.id) &&
              Number(job.run_attempt) === Number(run.run_attempt) &&
              job.head_sha === expectedSha
            );
            const job = matchingJobs[0];
            if (
              matchingJobs.length !== 1 ||
              job.status !== 'completed' ||
              job.conclusion !== 'success'
            ) {
              reject(
                `Expected one successful ${targetJobName} job in validation run ${run.id} attempt ${run.run_attempt}; found ${matchingJobs.length}.`
              );
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber
            });
            const expectedBaseRepo = `${owner}/${repo}`.toLowerCase();
            if (
              pr.base.ref !== 'main' ||
              String(pr.base.repo?.full_name || '').toLowerCase() !== expectedBaseRepo
            ) {
              reject(
                `PR #${pullNumber} targets ${pr.base.repo?.full_name || 'unknown'}/${pr.base.ref}; expected ${owner}/${repo}/main.`
              );
              return;
            }
            if (pr.state !== 'open' || pr.head.sha !== expectedSha) {
              reject(
                `PR #${pullNumber} is ${pr.state} with head ${pr.head.sha}; expected an open PR at ${expectedSha}.`
              );
              return;
            }

            const { data: baseRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${pr.base.ref}`
            });
            const currentBaseSha = baseRef.object.sha;
            const { data: comparison } = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: currentBaseSha,
              head: expectedSha,
              per_page: 1
            });
            const containsCurrentBase =
              ['ahead', 'identical'].includes(comparison.status) &&
              Number(comparison.behind_by) === 0 &&
              comparison.merge_base_commit?.sha === currentBaseSha;
            if (!containsCurrentBase) {
              reject(
                `PR #${pullNumber} head ${expectedSha} does not contain current ${pr.base.ref} ${currentBaseSha}.`
              );
              return;
            }

            core.setOutput('ok', 'true');
            core.setOutput(
              'summary',
              `Revalidated run ${run.id} attempt ${run.run_attempt}, job ${job.id}, head ${expectedSha}, base ${currentBaseSha}.`
            );
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          LOCAL_VALIDATION_CHECK_NAME: ${{ env.LOCAL_VALIDATION_CHECK_NAME }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Generate App Token for Cloud E2E Finalization
        if: |
          always() &&
          steps.app_token_secrets.outputs.available == 'true' &&
          steps.trigger_type.outputs.should_auto_trigger == 'true' &&
          (steps.pr_scope.outputs.mode == 'security_floor' || steps.pr_scope.outputs.mode == 'renovate_cloud_e2e') &&
          steps.wait_validation.outputs.ok == 'true' &&
          steps.have_secrets.outputs.ok == 'true'
        id: cloud_finalize_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.E2E_APP_ID }}
          private-key: ${{ secrets.E2E_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Finalize stable E2E check after Cloud Build
        if: |
          always() &&
          steps.trigger_type.outputs.should_auto_trigger == 'true' &&
          (steps.pr_scope.outputs.mode == 'security_floor' || steps.pr_scope.outputs.mode == 'renovate_cloud_e2e') &&
          steps.wait_validation.outputs.ok == 'true' &&
          steps.have_secrets.outputs.ok == 'true'
        id: finalize_check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.cloud_finalize_token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const checkRunId = Number('${{ steps.create_run_check.outputs.check_run_id }}') || 0;
            const runId = '${{ steps.run_id.outputs.e2e_run_id }}';
            const buildStatus = process.env.BUILD_STATUS.toUpperCase();
            const postBuildAuthorized = process.env.POST_BUILD_VALIDATION_OK === 'true';
            const detailsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let conclusion = 'failure';
            if (buildStatus === 'SUCCESS' && postBuildAuthorized) {
              conclusion = 'success';
            } else if (buildStatus === 'SUCCESS') {
              conclusion = 'action_required';
            } else if (buildStatus === 'CANCELLED' || buildStatus === 'TIMEOUT') {
              conclusion = 'cancelled';
            }

            const summaryLines = [
              `Google Cloud Build E2E run \`${runId}\` finished: **${buildStatus || 'UNKNOWN'}**.`,
              buildStatus === 'SUCCESS' && !postBuildAuthorized
                ? process.env.POST_BUILD_VALIDATION_SUMMARY || 'Post-build PR validation did not authorize this result.'
                : '',
              'Maintainers can inspect internal Cloud Build logs and artifacts from Google Cloud.'
            ].filter(Boolean);

            await github.rest.checks.update({
              owner,
              repo,
              check_run_id: checkRunId,
              details_url: detailsUrl,
              external_id: runId,
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: process.env.CHECK_RUN_NAME,
                summary: summaryLines.join('\n')
              }
            });

            core.setOutput('ok', conclusion === 'success' ? 'true' : 'false');
        env:
          BUILD_STATUS: ${{ steps.cloud_build.outputs.build_status }}
          CHECK_RUN_NAME: ${{ env.CHECK_RUN_NAME }}
          POST_BUILD_VALIDATION_OK: ${{ steps.post_build_validation.outputs.ok }}
          POST_BUILD_VALIDATION_SUMMARY: ${{ steps.post_build_validation.outputs.summary }}

      - name: Fail workflow when Cloud E2E failed
        if: |
          always() &&
          steps.trigger_type.outputs.should_auto_trigger == 'true' &&
          (steps.pr_scope.outputs.mode == 'security_floor' || steps.pr_scope.outputs.mode == 'renovate_cloud_e2e') &&
          steps.wait_validation.outputs.ok == 'true' &&
          steps.have_secrets.outputs.ok == 'true' &&
          steps.finalize_check.outputs.ok != 'true'
        run: |
          echo "Cloud E2E did not complete successfully."
          echo "Cloud Build status: ${{ steps.cloud_build.outputs.build_status }}"
          exit 1


      - name: Generate App Token for No-Cloud Finalization
        if: |
          steps.app_token_secrets.outputs.available == 'true' &&
          steps.trigger_type.outputs.should_auto_trigger == 'true' &&
          (steps.pr_scope.outputs.mode == 'ci_tools' || steps.pr_scope.outputs.mode == 'ci_only' || steps.pr_scope.outputs.mode == 'automation_config_only' || steps.pr_scope.outputs.mode == 'examples_dependency' || steps.pr_scope.outputs.mode == 'toolchain_update') &&
          steps.wait_validation.outputs.ok == 'true'
        id: no_cloud_finalize_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.E2E_APP_ID }}
          private-key: ${{ secrets.E2E_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Finalize stable E2E check for updates that do not require cloud E2E
        if: |
          steps.trigger_type.outputs.should_auto_trigger == 'true' &&
          (steps.pr_scope.outputs.mode == 'ci_tools' || steps.pr_scope.outputs.mode == 'ci_only' || steps.pr_scope.outputs.mode == 'automation_config_only' || steps.pr_scope.outputs.mode == 'examples_dependency' || steps.pr_scope.outputs.mode == 'toolchain_update') &&
          steps.wait_validation.outputs.ok == 'true'
        id: finalize_no_cloud
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.no_cloud_finalize_token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const checkRunId = Number('${{ steps.create_run_check.outputs.check_run_id }}') || 0;
            const runId = '${{ steps.run_id.outputs.e2e_run_id }}';
            const mode = '${{ steps.pr_scope.outputs.mode }}';
            let summary = 'Local validation policy succeeded, so cloud E2E was skipped by policy.';
            if (mode === 'ci_only') {
              summary = 'PR touched only CI files and no go.mod/go.sum files. Local validation policy succeeded, so cloud E2E was skipped by policy.';
            } else if (mode === 'ci_tools') {
              summary = 'The updated CI tools executed successfully during local validation, so cloud E2E was skipped by policy.';
            } else if (mode === 'automation_config_only') {
              summary = 'PR touched only Renovate configuration. Local validation policy succeeded, so cloud E2E was skipped by policy.';
            } else if (mode === 'examples_dependency') {
              summary = 'Renovate updated only checked-in example module metadata. Local validation includes example smoke tests, so cloud E2E was skipped by policy.';
            } else if (mode === 'toolchain_update') {
              summary = 'Renovate updated only the root go.mod toolchain directive. Local validation ran with that toolchain, and cloud E2E was skipped because this does not affect programs importing slogcp.';
            }

            await github.rest.checks.update({
              owner,
              repo,
              check_run_id: checkRunId,
              status: 'completed',
              conclusion: 'skipped',
              completed_at: new Date().toISOString(),
              output: {
                title: process.env.CHECK_RUN_NAME,
                summary
              }
            });

            core.setOutput('ok', 'true');
        env:
          CHECK_RUN_NAME: ${{ env.CHECK_RUN_NAME }}

      - name: Generate App Token for Blocked Auto-Path Finalization
        if: |
          always() &&
          steps.app_token_secrets.outputs.available == 'true' &&
          steps.trigger_type.outputs.should_auto_trigger == 'true' &&
          (steps.wait_validation.outputs.ok != 'true' ||
           ((steps.pr_scope.outputs.mode == 'security_floor' || steps.pr_scope.outputs.mode == 'renovate_cloud_e2e') && steps.have_secrets.outputs.ok != 'true'))
        id: blocked_finalize_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.E2E_APP_ID }}
          private-key: ${{ secrets.E2E_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Update stable E2E check when auto path cannot run
        if: |
          always() &&
          steps.trigger_type.outputs.should_auto_trigger == 'true' &&
          (steps.wait_validation.outputs.ok != 'true' ||
           ((steps.pr_scope.outputs.mode == 'security_floor' || steps.pr_scope.outputs.mode == 'renovate_cloud_e2e') && steps.have_secrets.outputs.ok != 'true'))
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.blocked_finalize_token.outputs.token }}
          script: |
            const validationOk = '${{ steps.wait_validation.outputs.ok }}' === 'true';
            const gcpSecretsOk = '${{ steps.have_secrets.outputs.ok }}' === 'true';
            const mode = '${{ steps.pr_scope.outputs.mode }}';
            let conclusion = ${{ toJSON(steps.wait_validation.outputs.conclusion) }} || 'action_required';
            let summary = ${{ toJSON(steps.wait_validation.outputs.summary) }} || 'Local validation did not complete successfully.';
            if (validationOk && (mode === 'security_floor' || mode === 'renovate_cloud_e2e') && !gcpSecretsOk) {
              conclusion = 'action_required';
              summary = `GCP E2E secrets are unavailable. A maintainer can run the "Manual E2E Test Trigger" workflow with PR #${{ github.event.pull_request.number }} after secrets are configured.`;
            }
            const checkRunId = Number('${{ steps.create_run_check.outputs.check_run_id }}') || 0;
            if (!checkRunId) {
              core.setFailed('No stable E2E check run was created for this auto path.');
              return;
            }

            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: checkRunId,
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: process.env.CHECK_RUN_NAME,
                summary
              }
            });
        env:
          CHECK_RUN_NAME: ${{ env.CHECK_RUN_NAME }}

      - name: Fail workflow when automatic E2E cannot run
        if: |
          always() &&
          steps.trigger_type.outputs.should_auto_trigger == 'true' &&
          (steps.wait_validation.outputs.ok != 'true' ||
           ((steps.pr_scope.outputs.mode == 'security_floor' || steps.pr_scope.outputs.mode == 'renovate_cloud_e2e') && steps.have_secrets.outputs.ok != 'true'))
        run: |
          echo "Automatic E2E gate did not reach a passable terminal state."
          echo "Local validation ok: ${{ steps.wait_validation.outputs.ok }}"
          echo "GCP secrets ok: ${{ steps.have_secrets.outputs.ok }}"
          exit 1
